name: Build and publish Nova

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Select release version and changelog
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const stableVersions = releases
              .filter(release => !release.draft && !release.prerelease)
              .map(release => {
                const match = /^v?(\d+)\.(\d+)\.(\d+)$/.exec(release.tag_name);
                return match
                  ? { major: Number(match[1]), minor: Number(match[2]), patch: Number(match[3]) }
                  : null;
              })
              .filter(Boolean)
              .sort((a, b) =>
                a.major - b.major || a.minor - b.minor || a.patch - b.patch);

            const project = fs.readFileSync('NovaManager.csproj', 'utf8');
            const projectMatch = /<Version>(\d+)\.(\d+)\.(\d+)<\/Version>/.exec(project);
            if (!projectMatch) {
              throw new Error('A three-part project version is required in NovaManager.csproj.');
            }
            const projectVersion = {
              major: Number(projectMatch[1]),
              minor: Number(projectMatch[2]),
              patch: Number(projectMatch[3])
            };
            const compare = (a, b) =>
              a.major - b.major || a.minor - b.minor || a.patch - b.patch;
            const latest = stableVersions[stableVersions.length - 1];
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const projectVersionText = `${projectVersion.major}.${projectVersion.minor}.${projectVersion.patch}`;
            const projectHotfix = new RegExp(
              `^##\\s+${projectVersionText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\s+[—-]\\s+Hotfix\\s*$`, 'm'
            ).test(changelog);
            const isSameVersionHotfix = Boolean(
              latest && compare(projectVersion, latest) === 0 && projectHotfix
            );
            const next = isSameVersionHotfix
              ? projectVersion
              : (!latest || compare(projectVersion, latest) > 0
                  ? projectVersion
                  : { ...latest, patch: latest.patch + 1 });
            const version = `${next.major}.${next.minor}.${next.patch}`;
            const escapedVersion = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const heading = new RegExp(`^##\\s+${escapedVersion}\\s+[—-]\\s+(Feature release|Hotfix)\\s*$`, 'm');
            const match = heading.exec(changelog);
            if (!match) {
              throw new Error(`CHANGELOG.md must contain a "## ${version} — Feature release" or "## ${version} — Hotfix" entry.`);
            }
            const section = changelog.slice(match.index + match[0].length);
            const notes = section.split(/^##\s+/m, 1)[0].trim();
            if (!notes) {
              throw new Error(`CHANGELOG.md entry for ${version} is empty.`);
            }

            core.setOutput('version', version);
            core.setOutput('release_type', match[1]);
            core.setOutput('release_name', `Nova Manager v${version} (${match[1]})`);
            core.setOutput('notes', notes);
            core.setOutput('replace_existing', isSameVersionHotfix ? 'true' : 'false');
            core.info(`Next Nova release: v${version} (${match[1]})`);

      - name: Publish self-contained Windows executable
        shell: pwsh
        run: >-
          dotnet publish .\NovaManager.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -o .\artifacts\publish

      - name: Create GitHub release and upload executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NAME: ${{ steps.version.outputs.release_name }}
          RELEASE_NOTES: ${{ steps.version.outputs.notes }}
          REPLACE_EXISTING: ${{ steps.version.outputs.replace_existing }}
        run: |
          $ErrorActionPreference = "Stop"
          $asset = ".\artifacts\publish\NovaManager.exe"
          if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
            throw "Published executable not found: $asset"
          }
          $tag = "v$env:VERSION"
          if ($env:REPLACE_EXISTING -eq "true") {
            gh release edit $tag `
              --repo "${{ github.repository }}" `
              --title "$env:RELEASE_NAME" `
              --notes "$env:RELEASE_NOTES"
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub CLI failed to update existing release $tag."
            }
            gh release upload $tag $asset --repo "${{ github.repository }}" --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub CLI failed to replace the executable for release $tag."
            }
          }
          else {
            gh release create $tag $asset `
              --repo "${{ github.repository }}" `
              --title "$env:RELEASE_NAME" `
              --notes "$env:RELEASE_NOTES" `
              --target "$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub CLI failed to create release $tag."
            }
          }
